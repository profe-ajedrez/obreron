version: "2"

run:
  go: "1.23.1"
  timeout: 5m
  tests: true
  issues-exit-code: 1

linters:
  default: none
  enable:
    - bodyclose
    - copyloopvar
    - depguard
    - dogsled
    - dupl
    - errcheck
    - exhaustive
    - goconst
    - gocritic
    - gocyclo
    - gosec
    - govet
    - ineffassign
    - misspell
    - mnd
    - nakedret
    - nolintlint
    - prealloc
    - predeclared
    - revive
    - staticcheck
    - thelper
    - tparallel
    - unconvert
    - unparam
    - unused
    - whitespace
    - wsl_v5

  settings:
    errcheck:
      check-type-assertions: true
    depguard:
      rules:
        Main:
          files:
            - $all
            - "!$test"
          deny:
            - pkg: github.com/pingcap/tidb/pkg/parser
              desc: "Solo permitido en tests (usa build tag o excluye tests)"
            - pkg: github.com/pingcap/tidb/pkg/parser/test_driver
              desc: "Solo permitido en tests"
    goconst:
      min-len: 2
      min-occurrences: 3

    gocritic:
      disabled-checks:
        - unnamedResult
      enabled-tags:
        - diagnostic
        - experimental
        - opinionated
        - performance
        - style

    govet:
      enable:
        - fieldalignment
        - shadow

    nolintlint:
      require-explanation: true
      require-specific: true

formatters:
  enable:
    - gofmt
    - goimports

issues:
  max-issues-per-linter: 0
  max-same-issues: 0